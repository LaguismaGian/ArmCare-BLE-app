name: armcare_ble
description: "ArmCare - BLE fall detection and monitoring app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.36.8
  sensors_plus: ^6.1.2
  audioplayers: ^6.1.0
  sqflite: ^2.4.1
  path: ^1.9.0
  permission_handler: ^11.3.1
  fl_chart: ^0.69.2
  url_launcher: ^6.3.1
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/